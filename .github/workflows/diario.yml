name: Actualización diaria

on:
  schedule:
    - cron: "*/30 5-20 * * *"  # cada 30 min: comprueba si Oleista ha publicado precios nuevos
    - cron: "0 21 * * *"       # cierre del día: publica noticias aunque hoy no haya precios nuevos
  workflow_dispatch:           # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: diario
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Precios, noticias y web
        run: python diario.py ${{ github.event.schedule == '*/30 5-20 * * *' && '--si-hay-cambios' || '' }}
        env:
          TZ: Europe/Madrid
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITIO_URL: ${{ vars.SITIO_URL }}
          CONTACTO_BOT: ${{ vars.CONTACTO_BOT }}
          PUBLICAR_PRECIOS_INFAOLIVA: ${{ vars.PUBLICAR_PRECIOS_INFAOLIVA }}

      - name: Guardar datos y publicar
        run: |
          git config user.name "aove-al-dia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos docs
          git diff --cached --quiet || git commit -m "Actualización diaria $(date +%F)"
          git push
