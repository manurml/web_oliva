# Artículo diario con Gemini. Usa los precios que el PC ya ha subido (Oleista bloquea GitHub),
# así que no descarga nada de las fuentes.
name: Artículo diario del AOVE

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diario
  cancel-in-progress: false

jobs:
  articulo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Redactar el artículo y regenerar la web
        run: python -m services.agent_aove
        env:
          TZ: Europe/Madrid
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITIO_URL: ${{ vars.SITIO_URL }}

      - name: Publicar
        run: |
          git config user.name "aove-al-dia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos docs
          git diff --cached --quiet && exit 0
          git commit -m "Artículo diario $(date +%F)"
          git pull --rebase --quiet
          git push
